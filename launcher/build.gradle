plugins {
    id 'application'
}

group = 'ru.sedmoyy'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'net.raphimc:MinecraftAuth:5.0.2'
}

application {
    mainClass = 'ru.sedmoyy.launcher.RadineeLauncher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
